<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch A Sketch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="row">
        <h1>Etch A Sketch</h1>

    </div>
    <div class="row">
        <div class="ui">
            <input type="number" name="number" class="input" placeholder="Number between 0-100"><button id="btnResize">RESIZE</button><button id="btnReset">RESET</button>
        </div>

    </div>
    <div class="row">
        <div class="container">
        </div>
    </div>
    <div class="row">
        <div class="ui">
            <button id="btnBw">B&W</button>
            <button id="btnRandom"><span id="randomColor">RANDOM</span></button>
            <button id="btnShade">SHADE</button>
        </div>

    </div>
    



    <script src="script.js"></script>
</body>
</html>
